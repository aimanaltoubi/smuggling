name: Windows portable app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run package:win

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/Oman-Incident-Analytics-x64.exe

      - name: Upload executable for manual workflow runs
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Oman-Incident-Analytics-x64
          path: release/Oman-Incident-Analytics-x64.exe
          if-no-files-found: error